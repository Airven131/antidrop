name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 仓库里没有提交 gradle-wrapper.jar（二进制），所以由 action 提供 Gradle。
      # 版本必须是 9.7.0：Fabric Loom 1.18.4 是按 Gradle 9.7.0 的 plugin API 构建的，
      # 用 9.5.x 会直接报 "No matching variant of net.fabricmc:fabric-loom:1.18.4"。
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antidrop-jars
          path: build/libs/*.jar
          if-no-files-found: error

      # 打 tag（v*）时自动创建 GitHub Release 并附带 jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

      # 可选：发布到 Modrinth（需要仓库 secret：MODRINTH_TOKEN / MODRINTH_PROJECT_ID）
      # - name: Publish to Modrinth
