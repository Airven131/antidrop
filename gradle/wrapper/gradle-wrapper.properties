distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.5.1 is the version recommended for Minecraft 26.2 by the Fabric blog post.
# The binary wrapper jar is not committed here; run `gradle wrapper --gradle-version 9.5.1`
# once (or let IntelliJ generate it) to create gradlew / gradlew.bat / gradle-wrapper.jar.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
