distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.7.0 is required: Fabric Loom 1.18.4 is built against Gradle's 9.7.0 plugin API and
# refuses to load on older Gradle ("No matching variant of net.fabricmc:fabric-loom").
# The binary wrapper jar is not committed here; run `gradle wrapper --gradle-version 9.7.0`
# once (or let IntelliJ generate it) to create gradlew / gradlew.bat / gradle-wrapper.jar.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
