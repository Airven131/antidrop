# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric properties — Minecraft 26.3 / Loader 0.20.0
#
# Verified against the official Fabric example mod (branch 26.3):
#   minecraft_version=26.3   loader_version=0.19.5   loom_version=1.18-SNAPSHOT
#   fabric_api_version=0.162.0+26.3
# This project pins Loader **0.20.0** (newest release, per request); it is a superset of 0.19.5's
# API and the interfaces used here (ClientModInitializer / FabricLoader#getConfigDir) are unchanged.
# Loom 1.18.4 is the newest *stable* release of the 1.18 line used by the template
# (1.18-SNAPSHOT is what the template pins; 1.19.1 exists if a newer toolchain is preferred).
minecraft_version=26.3
loader_version=0.20.0
loom_version=1.18-SNAPSHOT
fabric_api_version=0.162.0+26.3

# Mod properties
version=2.0.0
group=com.airven
archives_base_name=antidrop

# Soft dependency (compile only, never bundled).
# Mod Menu 21.0.0 targets Minecraft 26.3 (20.0.x = 26.2, 22.0.0-alpha.x = 26.4 snapshots).
modmenu_version=21.0.0
